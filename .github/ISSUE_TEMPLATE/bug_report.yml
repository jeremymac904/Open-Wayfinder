name: Report a problem
description: Tell us what went wrong using fictional or non-sensitive details.
body:
  - type: textarea
    id: steps
    attributes:
      label: What happened?
      description: Include the platform, steps and what you expected. Do not include private information.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What did you see?
